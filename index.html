  <style>
    [v-cloak] {
      display: none;
    }

    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      font-family: 'Inter', sans-serif;
    }

    .loading-content {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .pulse-ring {
      position: absolute;
      width: 120px;
      height: 120px;
      border: 4px solid var(--bs-primary);
      border-radius: 50%;
      opacity: 0;
      animation: pulse-animation 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
    }

    .pulse-ring.delay {
      animation-delay: 0.5s;
    }

    .brand-text {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: #333;
      z-index: 2;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .loading-status {
      font-size: 0.85rem;
      color: #6c757d;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 60px;
    }

    @keyframes pulse-animation {
      0% {
        transform: scale(0.5);
        opacity: 0.8;
        border-width: 4px;
      }

      100% {
        transform: scale(1.5);
        opacity: 0;
        border-width: 0px;
      }
    }

    .dot-1,
    .dot-2,
    .dot-3 {
      opacity: 0;
      animation: dot-fade 1.5s infinite;
    }

    .dot-1 {
      animation-delay: 0.0s;
    }

    .dot-2 {
      animation-delay: 0.2s;
    }

    .dot-3 {
      animation-delay: 0.4s;
    }

    @keyframes dot-fade {

      0%,
      100% {
        opacity: 0;
      }

      50% {
        opacity: 1;
      }
    }
  </style>
</head>

  <script type="module">
    import { getFirestore, collection, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { db } from "./js/firebase.js";

    window.patchPerpresGaji = async function () {
      try {
        const querySnapshot = await getDocs(collection(db, "master_gaji"));
        let count = 0;
        let promises = [];
        console.log(`Menemukan ${querySnapshot.size} total data gaji.`);

        querySnapshot.forEach((document) => {
          const data = document.data();

          // Filter: we add Perpres to ALL PNS Golongan (I, II, III, IV)
          // We assume it's PNS and not PPPK if it starts with I, V, X, or contains /a, /b
          const isPns = document.id.includes('I') || document.id.includes('V') || document.id.includes('A') || document.id.includes('B') || document.id.includes('C') || document.id.includes('D');

          if (isPns) {
            const docRef = doc(db, "master_gaji", document.id);
            promises.push(updateDoc(docRef, { "perpres": "Peraturan Pemerintah Nomor 5 Tahun 2024" }));
            count++;
          }
        });

        await Promise.all(promises);
        alert(`BERHASIL: Menambahkan perpres ke ${count} tabel master_gaji PNS!`);
      } catch (error) {
        console.error("Gagal update data gaji:", error);
        alert("GAGAL update data gaji: " + error.message);
      }
    };
  </script>

  <script>
    // ================================================================
    // AUTO-UPDATE SERVICE WORKER — SELF-HEALING AGRESIF
    // Menangani kasus browser yang masih terjebak di cache lama.
    // Algoritma:
    //  [0] Hapus semua SW lama (yang pakai ?v=timestamp) + cache lama
    //  [1] Listen pesan SW_UPDATED dari SW baru → reload otomatis
    //  [2] Listen controllerchange → reload otomatis
    //  [3] Register SW baru, trigger SKIP_WAITING saat update ditemukan
    //  [4] Cek update periodik setiap 5 menit
    // ================================================================
    (async function initSW() {
      if (!('serviceWorker' in navigator)) return;

      const VALID_CACHES = ['maspri-app-v4.0', 'maspri-vendor-v1'];

      // ── [0] SELF-HEALING: Bersihkan SW & cache lama ─────────────────
      try {
        // a) Unregister semua SW lama (termasuk yang pakai ?v=timestamp)
        const registrations = await navigator.serviceWorker.getRegistrations();
        for (const reg of registrations) {
          const url = (reg.active || reg.installing || reg.waiting)?.scriptURL || '';
          if (url.includes('sw.js?v=') || url.includes('sw.js?v')) {
            console.log('[SW] Unregister SW lama:', url);
            await reg.unregister();
          }
        }

        // b) Hapus semua cache yang tidak dikenal / sudah expired
        const cacheKeys = await caches.keys();
        await Promise.all(
          cacheKeys
            .filter(k => !VALID_CACHES.includes(k))
            .map(k => {
              console.log('[SW] Hapus cache lama dari halaman:', k);
              return caches.delete(k);
            })
        );
      } catch (e) {
        console.warn('[SW] Self-healing error (non-fatal):', e);
      }

      // ── [1] Terima pesan SW_UPDATED dari Service Worker ─────────────
      // Menangani kasus di mana halaman lama tidak punya controllerchange listener
      let reloading = false;
      navigator.serviceWorker.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'SW_UPDATED') {
          if (reloading) return;
          reloading = true;
          console.log('[SW] Pesan SW_UPDATED diterima → reload halaman...');
          window.location.reload();
        }
      });

      // ── [2] Deteksi controllerchange (SW baru mengambil alih) ───────
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloading) return;
        reloading = true;
        console.log('[SW] Controller baru aktif → reload halaman...');
        window.location.reload();
      });

      // ── [3] Register SW baru & trigger update ───────────────────────
      window.addEventListener('load', async () => {
        try {
          const registration = await navigator.serviceWorker.register('./sw.js');
          console.log('[SW] Terdaftar:', registration.scope);

          // Cek update langsung
          registration.update();

          // Listener saat SW baru ditemukan & selesai install
          registration.addEventListener('updatefound', () => {
            const newWorker = registration.installing;
            if (!newWorker) return;

            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                // SW baru siap → kirim SKIP_WAITING → activate → broadcast SW_UPDATED → reload
                console.log('[SW] Update tersedia → skip waiting...');
                newWorker.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });
        } catch (err) {
          console.warn('[SW] Registrasi gagal:', err);
        }

        // ── [4] Cek update periodik setiap 5 menit ───────────────────
        setInterval(async () => {
          try {
            const reg = await navigator.serviceWorker.ready;
            await reg.update();
          } catch (e) { /* silent */ }
        }, 5 * 60 * 1000);
      });
    })();
  </script>
